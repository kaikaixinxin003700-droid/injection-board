        .hint { font-size: 12px; color: #666; margin-top: 5px; display: block; }
        .btn {
            width: 100%; padding: 16px; border: none; border-radius: 10px; font-size: 16px; font-weight: 600;
            cursor: pointer; transition: all 0.3s; display: flex; align-items: center; justify-content: center; gap: 10px;

        .btn-primary { background: linear-gradient(135deg, var(--primary), #0066ff); color: white; box-shadow: 0 4px 14px rgba(0, 82, 217, 0.3); margin-top: 10px; }

        .btn-feedback { background: linear-gradient(135deg, #ffa940, #ff7a00); color: white; margin-top: 15px; }

        .section-title { color: var(--primary); font-size: 16px; font-weight: 600; margin-bottom: 15px; padding-bottom: 8px; border-bottom: 2px solid #e8f1ff; display: flex; align-items: center; gap: 8px; }

        .param-item { display: flex; flex-direction: column; }
        .param-label { font-size: 12px; color: #666; margin-bottom: 4px; }
        .param-value { background: white; padding: 10px; border-radius: 6px; border: 1px solid var(--border); font-weight: 600; font-size: 14px; }
        .param-value.important { background: #fff2f0; color: var(--danger); border-color: #ffccc7; }
        .param-table { width: 100%; border-collapse: collapse; margin: 15px 0; font-size: 13px; }
        .param-table th, .param-table td { border: 1px solid var(--border); padding: 10px; text-align: center; }
        .param-table th { background: #f0f7ff; color: var(--text); font-weight: 600; }
        .footer { text-align: center; margin-top: 25px; padding-top: 15px; border-top: 1px solid var(--border); font-size: 12px; color: #666; }
        .user-status { margin-top: 10px; font-size: 13px; }

        .defect-card i { color: var(--primary); font-size: 18px; }

        .defect-symptom {

        .step-num {

            background: linear-gradient(135deg, var(--primary), #0066ff); color: #fff;

        }
        .step-body { flex: 1; min-width: 0; }

        .step-desc { font-size: 13px; color: #595959; line-height: 1.65; word-break: break-word; }

        .param-box .pb-title { font-size: 13px; font-weight: 700; color: var(--primary); margin-bottom: 6px; }
        .param-box .pb-row { display: flex; justify-content: space-between; font-size: 13px; padding: 5px 0; border-bottom: 1px dashed #d6e8ff; }
        .param-box .pb-row:last-child { border-bottom: none; }
        .param-box .pb-row strong { color: var(--danger); }

        /* ========== AI 对话面板 ========== */
        .ai-modal-mask {

        .ai-modal-header .modal-close { color: #fff; background: none; border: none; font-size: 26px; cursor: pointer; line-height: 1; }
        .ai-context {

        .ai-chat { flex: 1 1 auto; overflow-y: auto; padding: 16px; background: #f7f9fc; -webkit-overflow-scrolling: touch; }
        .ai-msg { margin-bottom: 14px; display: flex; gap: 8px; }
        .ai-msg.user { flex-direction: row-reverse; }
        .ai-msg .bubble {

            .defect-grid { gap: 8px; }

        // ==================== 全局变量 ====================
        let currentUser = null;
        let feedbackCount = 0;

        let aiContextData = null;
        let aiStreaming = false;

        // ==================== 初始化 ====================
        document.addEventListener('DOMContentLoaded', function() {
            try {
                if (CONFIG.EMAILJS_PUBLIC_KEY && typeof emailjs !== 'undefined') {
                    emailjs.init(CONFIG.EMAILJS_PUBLIC_KEY);
                }
            } catch (e) { console.warn('EmailJS init failed:', e); }

            const urlParams = new URLSearchParams(window.location.search);
            const machineIdFromUrl = urlParams.get('id');
            const machineTag = document.getElementById('machineId');
            if (machineIdFromUrl && machineTag) {
                machineTag.innerText = machineIdFromUrl + " 号机";
                window.currentMachineId = machineIdFromUrl;
            } else {
                machineTag.innerText = "未知机台";
            }

            document.getElementById('langSwitchBtn').addEventListener('click', function() {
                currentLang = currentLang === 'zh' ? 'vi' : 'zh';
                updateUILanguage();
                refreshPlaceholders();
                if (document.getElementById('paramsSection').classList.contains('show')) showParameters();
                updateFeedbackCounter();
                refreshWatermark();
                if (document.getElementById('defectModal').classList.contains('show')) {
                    if (defectCurrentId) renderDefectDetail(defectCurrentId);
                    else renderDefectGrid();
                }
            });

            loadProducts();

            if (machineIdFromUrl && machineMapping[machineIdFromUrl]) {
                const mapping = machineMapping[machineIdFromUrl];
                const productSelect = document.getElementById('productSelect');
                const materialSelect = document.getElementById('materialSelect');
                const moldSelect = document.getElementById('moldSelect');
                productSelect.value = mapping.product;
                onProductChange();
                materialSelect.value = mapping.material;
                onMaterialChange();
                moldSelect.value = mapping.mold;
                onMoldChange();
                document.getElementById('viewParamsBtn').click();
            }

            document.getElementById('productSelect').addEventListener('change', onProductChange);
            document.getElementById('materialSelect').addEventListener('change', onMaterialChange);
            document.getElementById('moldSelect').addEventListener('change', onMoldChange);
            document.getElementById('viewParamsBtn').addEventListener('click', showParameters);
            document.getElementById('feedbackBtn').addEventListener('click', showFeedbackForm);

            document.getElementById('defectBtn').addEventListener('click', openDefectModal);
            document.getElementById('defectModal').addEventListener('click', function(e) {
                if (e.target === this) closeDefectModal();
            });

            document.getElementById('aiModal').addEventListener('click', function(e) {
                if (e.target === this) closeAIModal();
            });

            const searchInput = document.getElementById('defectSearchInput');
            searchInput.addEventListener('input', function(e) {
                defectSearchText = e.target.value;
                renderDefectGrid();
            });

            // AI 输入框回车发送
            document.getElementById('aiInput').addEventListener('keydown', function(e) {
                if (e.key === 'Enter' && !e.shiftKey) {
                    e.preventDefault();
                    sendAIMessage();
                }
            });

            loadUserInfo();
            loadFeedbackCount();
            initWatermark(machineIdFromUrl || "未知机台");

            document.addEventListener('contextmenu', e => e.preventDefault());
            document.addEventListener('copy', e => e.preventDefault());
            document.addEventListener('cut', e => e.preventDefault());
        });

        // ==================== 语言切换 ====================
        function updateUILanguage() {
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (el.tagName !== 'SELECT' && el.tagName !== 'OPTION') {
                    el.textContent = t(key);
                }
            });
        }

        function refreshPlaceholders() {
            const prodPh = document.querySelector('#productSelect option[value=""]');
            if (prodPh) prodPh.textContent = t('product_placeholder');
            const matPh = document.querySelector('#materialSelect option[value=""]');
            if (matPh) matPh.textContent = t('material_placeholder');
            const moldPh = document.querySelector('#moldSelect option[value=""]');
            if (moldPh) moldPh.textContent = t('mold_placeholder');
        }

        // ==================== 产品联动 ====================
        function loadProducts() {
            const productSelect = document.getElementById('productSelect');
            Object.keys(processDatabase).forEach(product => {
                const opt = document.createElement('option');
                opt.value = product;
                opt.textContent = product;
                productSelect.appendChild(opt);
            });
        }

        function onProductChange() {
            const product = document.getElementById('productSelect').value;
            const materialSelect = document.getElementById('materialSelect');
            const moldSelect = document.getElementById('moldSelect');

            materialSelect.innerHTML = '';
            const matPh = document.createElement('option');
            matPh.value = '';
            matPh.textContent = t('material_placeholder');
            materialSelect.appendChild(matPh);

            moldSelect.innerHTML = '';
            const moldPh = document.createElement('option');
            moldPh.value = '';
            moldPh.textContent = t('mold_placeholder');
            moldSelect.appendChild(moldPh);
            moldSelect.disabled = true;

            if (product && processDatabase[product]) {
                materialSelect.disabled = false;
                Object.keys(processDatabase[product]).forEach(mat => {
                    const opt = document.createElement('option');
                    opt.value = mat;
                    opt.textContent = mat;
                    materialSelect.appendChild(opt);
                });
            } else {
                materialSelect.disabled = true;
            }
            updateViewButton();
        }

        function onMaterialChange() {
            const product = document.getElementById('productSelect').value;
            const material = document.getElementById('materialSelect').value;
            const moldSelect = document.getElementById('moldSelect');

            moldSelect.innerHTML = '';
            const moldPh = document.createElement('option');
            moldPh.value = '';
            moldPh.textContent = t('mold_placeholder');
            moldSelect.appendChild(moldPh);

            if (product && material && processDatabase[product] && processDatabase[product][material]) {
                moldSelect.disabled = false;
                Object.keys(processDatabase[product][material]).forEach(m => {
                    const opt = document.createElement('option');
                    opt.value = m;
                    opt.textContent = `模具 ${m}`;
                    moldSelect.appendChild(opt);
                });
            } else {
                moldSelect.disabled = true;
            }
            updateViewButton();
        }

        function onMoldChange() { updateViewButton(); }

        function updateViewButton() {
            const product = document.getElementById('productSelect').value;
            const material = document.getElementById('materialSelect').value;
            const mold = document.getElementById('moldSelect').value;
            document.getElementById('viewParamsBtn').disabled = !(product && material && mold);
        }

        function buildSystemPrompt() {
            const { d, product, material, mold, machineId, params } = aiContextData;
            const zh = currentLang === 'zh';

            let paramLines = '';
            if (params) {
                const keyLabels = {
                    dryingTemp: '干燥温度', weight: '单重', fixedMoldTemp: '定模温度', movingMoldTemp: '动模温度',
                    tempControlBox: '温控箱', moldOpeningEnd: '开模终点', ejectionEnd: '顶出终点',
                    nozzle: '射嘴', barrel1: '料管1', barrel2: '料管2', barrel3: '料管3', barrel4: '料管4',
                    injection1Speed: '射1速', injection1Pressure: '射1压', injection1Position: '射1位',
                    injection2Speed: '射2速', injection2Pressure: '射2压', injection2Position: '射2位',
                    injection3Speed: '射3速', injection3Pressure: '射3压', injection3Position: '射3位',
                    injection4Speed: '射4速', injection4Pressure: '射4压', injection4Position: '射4位',
                    holdingEnd: '保压终点', holdingPosition: '保压位置', holdingTime: '保压时间',
                    holding1Time: '保1时间', holding1Speed: '保1速度', holding1Pressure: '保1压力',
                    holding2Time: '保2时间', holding2Speed: '保2速度', holding2Pressure: '保2压力',
                    melting1BackPressure: '储1背压', melting1Speed: '储1速度', melting1Pressure: '储1压力', melting1Position: '储1位',
                    melting2BackPressure: '储2背压', melting2Speed: '储2速度', melting2Pressure: '储2压力', melting2Position: '储2位',
                    melting3BackPressure: '储3背压', melting3Speed: '储3速度', melting3Pressure: '储3压力', melting3Position: '储3位',
                };
                const parts = [];
                for (const [k, label] of Object.entries(keyLabels)) {
                    if (params[k] !== undefined && params[k] !== '') {
                        parts.push(`${label}:${params[k]}`);
                    }
                }
                paramLines = parts.join('，');
            }

            const stepsText = d.steps.map((s, i) => `${i+1}. ${s.t} —— ${s.d}`).join('\n');

            return `你是一位资深注塑工艺工程师，精通各类注塑缺陷的成因分析、参数调机和现场排查。

【现场信息】
机台：${machineId}
产品：${product || '未指定'}
材料：${material || '未指定'}
模具：${mold || '未指定'}
异常现象：${zh ? d.name : d.nameVi}
现象描述：${zh ? d.symptom : d.symptomVi}

【当前工艺参数】
${paramLines || '（用户未选择具体工艺参数）'}

【标准处理步骤（用户可能已尝试部分或全部）】
${stepsText}

【回答要求】
1. 结合上述具体参数数值做诊断，指出可能的根因，不要泛泛而谈。
2. 给出下一步具体的调机建议：调哪个参数、往哪个方向调、建议的数值范围、以及判断改善的标准。
3. 若涉及模具/设备/材料，也请给出排查方向。
4. 如果信息不足，请先问 1-2 个关键问题，不要凭空猜测。
5. 输出使用中文，分点作答，简洁、专业、可操作。`;
        }

        async function sendAIMessage(isOpening = false) {
            if (aiStreaming) return;

            const input = document.getElementById('aiInput');
            const userText = isOpening
                ? '请先根据以上信息给出你的初步诊断和调机建议。'
                : input.value.trim();

            if (!userText && !isOpening) return;

            appendAIMessage('user', userText);
            aiMessages.push({ role: 'user', content: userText });
            input.value = '';

            const aiBubble = appendAIMessage('ai', '');
            aiBubble.innerHTML = '<span class="ai-typing">AI 正在思考...</span>';

            aiStreaming = true;
            document.getElementById('aiSendBtn').disabled = true;

            try {
                const messages = [
                    { role: 'system', content: buildSystemPrompt() },
                    ...aiMessages
                ];

                const url = AI_CONFIG.mode === 'proxy' ? AI_CONFIG.proxyUrl : AI_CONFIG.baseUrl;
                const headers = { 'Content-Type': 'application/json' };
                if (AI_CONFIG.mode !== 'proxy') {
                    headers['Authorization'] = `Bearer ${AI_CONFIG.apiKey}`;
                }

                const resp = await fetch(url, {
                    method: 'POST',
                    headers,
                    body: JSON.stringify({
                        model: AI_CONFIG.model,
                        messages,
                        stream: true,
                        temperature: AI_CONFIG.temperature,
                    })
                });

                if (!resp.ok) {
                    const errText = await resp.text();
                    throw new Error(`API 错误 ${resp.status}: ${errText.slice(0, 300)}`);
                }

                const reader = resp.body.getReader();
                const decoder = new TextDecoder('utf-8');
                let fullText = '';
                aiBubble.innerHTML = '';

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;
                    const chunk = decoder.decode(value, { stream: true });
                    const lines = chunk.split('\n');
                    for (const line of lines) {
                        const trimmed = line.trim();
                        if (!trimmed || !trimmed.startsWith('data:')) continue;
                        const data = trimmed.slice(5).trim();
                        if (data === '[DONE]') continue;
                        try {
                            const json = JSON.parse(data);
                            const delta = json.choices?.[0]?.delta?.content || '';
                            if (delta) {
                                fullText += delta;
                                aiBubble.textContent = fullText;
                                const chat = document.getElementById('aiChat');
                                chat.scrollTop = chat.scrollHeight;
                            }
                        } catch(e) { /* 忽略解析错误 */ }
                    }
                }

                if (!fullText) {
                    aiBubble.textContent = '（AI 未返回内容，请重试）';
                }
                aiMessages.push({ role: 'assistant', content: fullText });

            } catch (err) {
                console.error('[AI] 请求失败', err);
                aiBubble.innerHTML = `<span style="color:#d9001b;">❌ 请求失败：${err.message}<br><br>请检查 AI 配置（API Key / 代理地址 / 网络）。</span>`;
            } finally {
                aiStreaming = false;
                document.getElementById('aiSendBtn').disabled = false;
                const chat = document.getElementById('aiChat');
                chat.scrollTop = chat.scrollHeight;
            }
        }

        function appendAIMessage(role, text) {
            const chat = document.getElementById('aiChat');
            const div = document.createElement('div');
            div.className = 'ai-msg ' + role;
            const avatar = role === 'user' ? '<i class="fas fa-user"></i>' : '<i class="fas fa-robot"></i>';
            div.innerHTML = `<div class="avatar">${avatar}</div><div class="bubble"></div>`;
            const bubble = div.querySelector('.bubble');
            bubble.textContent = text;
            chat.appendChild(div);
            chat.scrollTop = chat.scrollHeight;
            return bubble;
        }

        // ==================== 反馈 ====================
        function showFeedbackForm() {
            if (!currentUser) {
                Swal.fire({
                    title: t('need_login_title'), text: t('need_login_text_feedback'),
                    icon: 'warning', confirmButtonText: t('go_set'), allowOutsideClick: false
                }).then(() => showLogin());
                return;
            }

            const product = document.getElementById('productSelect').value || '未选择';
            const material = document.getElementById('materialSelect').value || '未选择';
            const mold = document.getElementById('moldSelect').value || '未选择';
            const machineId = document.getElementById('machineId').textContent;

            let userInfoHtml = `<div style="background: #f0f9ff; padding: 12px; border-radius: 8px; margin-bottom: 15px; border: 1px solid #bae0ff;"><p style="margin: 0; font-size: 14px; color: #0066cc;"><strong>${t('feedback_btn')}:</strong> ${currentUser.name}${currentUser.dept ? `(${currentUser.dept})` : ''}</p></div>`;

            Swal.fire({
                title: t('feedback_title'),
                html: `<div style="text-align: left; max-height: 500px; overflow-y: auto;">${userInfoHtml}<div style="margin-bottom: 15px;"><label style="display: block; margin-bottom: 5px; font-weight: 600;">${t('feedback_type_label')}</label><select id="fbType" style="width:100%; padding:10px; border:1px solid #ddd; border-radius:6px; margin-bottom:15px;"><option value="参数不一致">${t('feedback_type1')}</option><option value="操作问题">${t('feedback_type2')}</option><option value="设备故障">${t('feedback_type3')}</option><option value="材料问题">${t('feedback_type4')}</option><option value="改进建议">${t('feedback_type5')}</option><option value="其他">${t('feedback_type6')}</option></select></div><div style="margin-bottom: 15px;"><label style="display: block; margin-bottom: 5px; font-weight: 600;">${t('feedback_content_label')}</label><textarea id="fbContent" placeholder="${t('feedback_placeholder')}" style="width:100%; min-height:120px; padding:10px; border:1px solid #ddd; border-radius:6px; resize: vertical;"></textarea></div><div style="margin-top: 15px;"><label><input type="checkbox" id="fbUrgent" style="margin-right: 5px;"><strong>${t('feedback_urgent')}</strong></label></div></div>`,
                showCancelButton: true,
                confirmButtonText: t('feedback_submit'),
                confirmButtonColor: '#ffa940',
                preConfirm: () => {
                    const content = document.getElementById('fbContent').value;
                    if (!content.trim()) { Swal.showValidationMessage(t('feedback_required')); return false; }
                    return {
                        product, material, mold, machineId,
                        user_name: currentUser.name,
                        user_dept: currentUser.dept || '',
                        type: document.getElementById('fbType').value,
                        content,
                        urgent: document.getElementById('fbUrgent').checked,
                        timestamp: new Date().toISOString(),
                        page_url: window.location.href
                    };
                }
            }).then((result) => {
                if (result.isConfirmed) submitFeedback(result.value);
            });
        }

        function submitFeedback(feedbackData) {
            const AIRTABLE_TOKEN = 'patmwwKTnjhzz3P4X.a2cba8ef2be95efe4019ae2c435573cb7ab2615a29f18d364aacb831504c0303';
            const BASE_ID = 'app4BOISlcFuPZFdd';
            const TABLE_ID = 'tbl240rBBEgoaB2nm';

            feedbackCount++;
            updateFeedbackCounter();
            saveFeedbackToLocal(feedbackData);
            pushToWeChat(feedbackData);

            if (CONFIG.EMAILJS_PUBLIC_KEY && CONFIG.EMAILJS_PUBLIC_KEY !== '请填写您的EmailJS Public Key') {
                sendEmailViaEmailJS(feedbackData);
            }

            fetch(`https://api.airtable.com/v0/${BASE_ID}/${TABLE_ID}`, {
                method: 'POST',
                headers: { 'Authorization': `Bearer ${AIRTABLE_TOKEN}`, 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    records: [{
                        fields: {
                            "machineId": feedbackData.machineId || "",
                            "user_name": feedbackData.user_name || "",
                            "content": feedbackData.content || "",
                            "time": new Date().toISOString()
                        }
                    }]
                })
            }).catch(err => console.error('Airtable 网络错误:', err));

            Swal.fire({
                title: t('feedback_success'), text: t('feedback_success_text'),
                icon: 'success', confirmButtonText: '确定'
            });
        }

        function pushToWeChat(data) {
            if (!CONFIG.serverChanKey) return;
            const title = `${data.urgent ? '🚨紧急' : '📝'}注塑反馈：${data.machineId}`;
            const desp = `**反馈人**: ${data.user_name}\n**类型**: ${data.type}\n**内容**: ${data.content}\n\n[点击查看看板](${data.page_url})`;
            fetch(`https://sctapi.ftqq.com/${CONFIG.serverChanKey}.send?title=${encodeURIComponent(title)}&desp=${encodeURIComponent(desp)}`)
                .catch(err => console.error('推送失败:', err));
        }

        function sendEmailViaEmailJS(data) {
            emailjs.send(CONFIG.EMAILJS_SERVICE_ID, CONFIG.EMAILJS_TEMPLATE_ID, {
                machine_id: data.machineId, product: data.product, material: data.material, mold: data.mold,
                user_name: data.user_name, user_dept: data.user_dept, type: data.type,
                content: data.content, urgent: data.urgent,
                time: new Date(data.timestamp).toLocaleString('zh-CN'), page_url: data.page_url
            }).catch(e => console.error('邮件发送失败', e));
        }

        function saveFeedbackToLocal(feedbackData) {
            try {
                let feedbacks = JSON.parse(localStorage.getItem('injection_feedbacks') || '[]');
                feedbacks.push({ ...feedbackData, id: 'FB' + Date.now(), status: '待处理' });
                localStorage.setItem('injection_feedbacks', JSON.stringify(feedbacks));
            } catch (e) {}
        }

        function loadFeedbackCount() {
            try {
                feedbackCount = JSON.parse(localStorage.getItem('injection_feedbacks') || '[]').length;
                updateFeedbackCounter();
            } catch (e) {}
        }

        function loadUserInfo() {
            try {
                const saved = localStorage.getItem('injection_user');
                if (saved) { currentUser = JSON.parse(saved); }
                updateUserStatus();
            } catch (e) { updateUserStatus(); }
        }

        function logout() {
            localStorage.removeItem('injection_user');
            currentUser = null;
            updateUserStatus();
            refreshWatermark();
            showLogin(true);
        }

        window.showLogin = showLogin;
        window.logout = logout;
        window.closeDefectModal = closeDefectModal;
        window.openAIModal = openAIModal;
        window.closeAIModal = closeAIModal;
        window.sendAIMessage = sendAIMessage;
    </script>
</body>
</html>
